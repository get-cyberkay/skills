name: QRadar Proxy Successful Phishing
description: Handles QRadar offenses generated by rule GTBNIG 045 - Proxy - Successful
  phishing detected. Performs the common parts of the investigation (severity mapping,
  optional log fetch, indicator enrichment, Bluecoat payload parsing) and checks the
  destination against the phishing-simulation whitelist. To reduce alert fatigue,
  clear-cut outcomes are auto-closed - a confirmed-malicious destination has its DOMAIN
  added to the EDL (never the IP - phishing sites are commonly CDN-fronted and IP
  blocks cause collateral outages) and the offense is auto-closed as a True Positive,
  while a good or no verdict is auto-closed as a False Positive. Only ambiguous (suspicious)
  cases are routed to manual investigation for the user-response actions (credential
  reset, session revocation) that cannot be automated. Based on the QRadar Proxy Excessive
  Downloads playbook format.
