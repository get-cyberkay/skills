                      (<em>${Offense.offense_description}</em>)
                      was closed as a <strong>benign true positive (business as usual)</strong> by
                      <strong>${incident.closingUserId}</strong>.
                      The transfer from <strong>${Offense.offense_src_ip}</strong>
                      to <strong>${Offense.offense_dst_ip}</strong>
                      on port <strong>${Offense.offense_dst_port}</strong>
                      matched expected operational traffic.
                    </td>
                  </tr>

                  <!-- Offense details -->
                  <tr>
                    <td style="padding:8px 28px 4px 28px;">
                      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:13px;color:#24292e;">
