                          <td style="padding:8px 10px;border:1px solid #e1e4e8;">${Offense.offense_dst_ip}</td>
                        </tr>
                        <tr>
                          <td style="padding:8px 10px;background-color:#f6f8fa;border:1px solid #e1e4e8;font-weight:bold;">Destination Port</td>
                          <td style="padding:8px 10px;border:1px solid #e1e4e8;">${Offense.offense_dst_port}</td>
                        </tr>
                        <tr>
