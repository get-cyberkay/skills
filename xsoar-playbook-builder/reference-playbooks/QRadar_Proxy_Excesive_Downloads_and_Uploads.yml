                    <td style="padding:16px 28px 4px 28px;">
                      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:13px;color:#24292e;">
                        <tr>
                          <td width="40%" style="padding:8px 10px;background-color:#f6f8fa;border:1px solid #e1e4e8;font-weight:bold;">Disposition</td>
                          <td style="padding:8px 10px;border:1px solid #e1e4e8;">Benign True Positive — Business as Usual</td>
                        </tr>
                        <tr>
                          <td style="padding:8px 10px;background-color:#f6f8fa;border:1px solid #e1e4e8;font-weight:bold;">Closed By</td>
